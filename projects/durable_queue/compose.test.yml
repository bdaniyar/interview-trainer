name: pythoria-durable-queue-test
services:
  db:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_PASSWORD: synthetic-bootstrap-only
      POSTGRES_DB: queue_test
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    healthcheck:
      test: ["CMD-SHELL","pg_isready -h 127.0.0.1 -U postgres -d queue_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [lab]
  api:
    build: .
    image: pythoria-durable-queue:test
    environment:
      DATABASE_URL: postgresql+psycopg://queueapp:synthetic-local-only@db/queue_test
    depends_on:
      db:
        condition: service_healthy
    networks: [lab]
  tests:
    image: pythoria-durable-queue:test
    command: ["pytest","-q","-p","no:cacheprovider","tests"]
    environment:
      DATABASE_URL: postgresql+psycopg://queueapp:synthetic-local-only@db/queue_test
      ADMIN_DATABASE_URL: postgresql+psycopg://postgres:synthetic-bootstrap-only@db/queue_test
      QUEUE_PROJECT_TEST: "1"
      API_URL: http://api:8000
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    networks: [lab]
networks:
  lab:
    internal: true
