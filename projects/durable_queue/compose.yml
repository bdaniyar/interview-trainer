name: pythoria-durable-queue
x-runtime: &runtime
  image: pythoria-durable-queue:phase8c
  environment:
    DATABASE_URL: postgresql+psycopg://queueapp:synthetic-local-only@db/queue_lab
  depends_on:
    db:
      condition: service_healthy
  read_only: true
  tmpfs: ["/tmp:size=16m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 192m
  pids_limit: 64
  networks: [lab]
services:
  db:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_PASSWORD: synthetic-bootstrap-only
      POSTGRES_DB: queue_lab
    volumes:
      - queue_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -h 127.0.0.1 -U postgres -d queue_lab"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [lab]
  api:
    <<: *runtime
    networks: [lab, edge]
    build: .
    ports: ["127.0.0.1:18090:8000"]
  worker:
    <<: *runtime
    command: ["python","-m","queue_app.worker"]
    stop_grace_period: 10s
  relay:
    <<: *runtime
    command: ["python","-m","queue_app.outbox"]
    environment:
      DATABASE_URL: postgresql+psycopg://queueapp:synthetic-local-only@db/queue_lab
      RECEIVER_URL: http://api:8000/demo-effects
  periodic:
    <<: *runtime
    command: ["python","-m","queue_app.periodic"]
volumes:
  queue_data:
networks:
  edge: {}
  lab:
    internal: true
