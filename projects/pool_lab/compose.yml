name: pythoria-pooling-exercise
services:
  db:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_DB: lab
      POSTGRES_PASSWORD: synthetic-bootstrap-only
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    tmpfs:
      - /var/lib/postgresql/data:size=128m
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -d lab -U learner"]
      retries: 15
      interval: 2s
      timeout: 2s
  exercise:
    build: .
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    pids_limit: 64
    mem_limit: 192m
    cpus: 1.0
    environment:
      POOL_DSN: postgresql+psycopg://learner:local-training@db/lab
    networks: [lab]
    depends_on:
      db:
        condition: service_healthy
networks:
  lab:
    internal: true
