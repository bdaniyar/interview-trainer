name: pythoria-architecture
x-runtime:
  image: pythoria-architecture:test
  read_only: true
  tmpfs: &id001
  - /tmp:size=16m
  cap_drop: &id002
  - ALL
  security_opt: &id003
  - no-new-privileges:true
  networks: &id004
  - lab
  depends_on: &id005
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_PASSWORD: synthetic-bootstrap-only
    volumes:
    - architecture_data:/var/lib/postgresql/data
    - ./bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    - ./orders.sql:/init/orders.sql:ro
    - ./notifications.sql:/init/notifications.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U postgres -d arch_mono
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
    - lab
  orders:
    image: pythoria-architecture:phase8d
    read_only: true
    tmpfs: *id001
    cap_drop: *id002
    security_opt: *id003
    networks: [lab, edge]
    depends_on: *id005
    build: .
    environment:
      ORDERS_DATABASE_URL: postgresql+psycopg://ordersapp:synthetic-orders-only@db/arch_orders
    ports:
    - 127.0.0.1:18101:8000
  notifications:
    image: pythoria-architecture:phase8d
    read_only: true
    tmpfs: *id001
    cap_drop: *id002
    security_opt: *id003
    networks: [lab, edge]
    depends_on: *id005
    command:
    - uvicorn
    - architecture.api:notifications_app
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      NOTIFICATIONS_DATABASE_URL: postgresql+psycopg://notifyapp:synthetic-notify-only@db/arch_notify
    ports:
    - 127.0.0.1:18102:8000
  monolith:
    image: pythoria-architecture:phase8d
    read_only: true
    tmpfs: *id001
    cap_drop: *id002
    security_opt: *id003
    networks: [lab, edge]
    depends_on: *id005
    environment:
      MODE: monolith
      ORDERS_DATABASE_URL: postgresql+psycopg://monoapp:synthetic-mono-only@db/arch_mono
    ports:
    - 127.0.0.1:18100:8000
  relay:
    image: pythoria-architecture:phase8d
    read_only: true
    tmpfs: *id001
    cap_drop: *id002
    security_opt: *id003
    networks: *id004
    depends_on: *id005
    command:
    - python
    - -m
    - architecture.relay
    environment:
      ORDERS_DATABASE_URL: postgresql+psycopg://ordersapp:synthetic-orders-only@db/arch_orders
      NOTIFICATION_URL: http://notifications:8000
networks:
  edge: {}
  lab:
    internal: true
volumes:
  architecture_data: {}
