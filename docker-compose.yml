name: pythoria

services:
  sql-sandbox:
    image: pythoria-sql-sandbox:phase1
    build:
      context: .
      dockerfile: sql_runner/sandbox/Dockerfile
    entrypoint: ["/opt/sql-venv/bin/python", "--version"]
    network_mode: none
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:size=1m
    restart: "no"

  sql-runner:
    image: pythoria-sql-runner:phase1
    build:
      context: .
      dockerfile: sql_runner/Dockerfile
    environment:
      SQL_SANDBOX_IMAGE: pythoria-sql-sandbox:phase1
      SQL_RUNNER_NAMESPACE: pythoria-sql-local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sql-sandbox:
        condition: service_completed_successfully
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  sandbox:
    image: pythoria-sandbox:local
    build:
      context: ./runner/sandbox
    command: ["python", "--version"]
    restart: "no"

  runner:
    build:
      context: ./runner
    environment:
      RUNNER_MODE: docker
      SANDBOX_IMAGE: pythoria-sandbox:local
      EXECUTION_TIMEOUT: "4"
      OUTPUT_LIMIT: "32768"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox:
        condition: service_completed_successfully
    expose:
      - "8001"
    ports:
      - "8001:8001"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/pythoria.db
      CONTENT_ROOT: /content
      RUNNER_URL: http://runner:8001
      SQL_RUNNER_URL: http://sql-runner:8002
    volumes:
      - pythoria_data:/data
      - ./content:/content:ro
    ports:
      - "8080:8000"
    depends_on:
      - runner
      - sql-runner
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pythoria_data:
